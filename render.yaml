# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then Render Dashboard > New > Blueprint.
# After the first deploy, set the secret env vars flagged `sync: false` below.

databases:
  - name: isdb-radio-db
    databaseName: isdb_radio
    user: isdb_radio
    plan: free            # ⚠ Render free Postgres is deleted 30 days after creation.
    region: frankfurt      # closest Render region to Togo

services:
  - type: web
    name: isdb-radio-api
    runtime: docker
    plan: free             # ⚠ free web services sleep after 15 min idle (~50 s cold start)
    region: frankfurt
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Radio ISDB"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false         # `php artisan key:generate --show` → paste the base64:... value
      - key: APP_URL
        sync: false         # set to https://<your-service>.onrender.com after the first deploy
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: isdb-radio-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public       # local uploads — see note in DEPLOY_RENDER.md about R2 for persistence
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Administrateur ISDB"

    # Uncomment to keep uploaded covers/audio across deploys (needs a paid instance):
    # disk:
    #   name: isdb-storage
    #   mountPath: /var/www/html/storage/app/public
    #   sizeGB: 1
