; Radio ISDB — the php:8.3 base image caps uploads at 2M / post at 8M, which
; silently breaks episode-audio uploads in the back-office. Raise the limits and
; give getID3 room + time to probe the duration on a slow connection.
upload_max_filesize = 200M
post_max_size = 210M
memory_limit = 384M
max_execution_time = 300
max_input_time = 300
